server:
  port: 8081

spring:
  application:
    name: blog-app-apis
  datasource:
    url: jdbc:mysql://localhost:3306/blog_application
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

filepath: D:\SpringBoot\blog-app-apis\target\uploadedFiles